name: DigiCert test

on: [push]
jobs:
  create-bin:
    runs-on: windows-latest
    steps:
      - name: Copy binary to workspace
        run: cp c:\\Windows\\notepad.exe ${{ github.workspace }}\\binary.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: my-binary
          path: ${{ github.workspace }}\\binary.exe

  binary-sign:
    needs: create-bin
    runs-on: windows-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Copy artifact to workspace
        uses: actions/download-artifact@v4
        with:
          name: my-binary
          path: ${{ github.workspace }}

      - name: List files in the repository
        run: |
            ls ${{ github.workspace }}

      # - name: Install DigiCert Client tools from Github Custom Actions marketplace
      #   uses: digicert/code-signing-software-trust-action@v1

      - name: Set up certificate
        run: |
          echo "${{ secrets.CODESIGN_WIN_CERT_P12_BASE64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
        shell: bash

      - name: Setup Software Trust Manager
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          # If the below 2 parameters are supplied, then smctl executable is invoked to attempt the signing.
          input: binary.exe
          keypair-alias: key_1369544803
        env:
          SM_HOST: ${{ vars.CODESIGN_WIN_KEYLOCKER_HOST }}
          SM_API_KEY: ${{ secrets.CODESIGN_WIN_KEYLOCKER_API_KEY }}
          SM_CLIENT_CERT_FILE: D:\\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.CODESIGN_WIN_CERT_P12_PASSWORD }}
          shell: bash


      # - name: Set variables
      #   id: variables
      #   run: |
      #     echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      #     echo "SM_HOST=${{ secrets.CODESIGN_WIN_KEYLOCKER_HOST }}" >> "$GITHUB_ENV"
      #     echo "SM_API_KEY=${{ secrets.CODESIGN_WIN_KEYLOCKER_API_KEY }}" >> "$GITHUB_ENV"
      #     echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
      #     echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.CODESIGN_WIN_CERT_P12_PASSWORD }}" >> "$GITHUB_ENV"
      #   shell: bash
      # - name: Signing using keypair alias
      #   run: |
      #      # smctl sign --keypair-alias ${{ secrets.KEYLOCKER_KEYPAIR_ALIAS }} --input binary.exe

      #   shell: cmd

      - name: upload signed installer
        uses: actions/upload-artifact@v4
        with:
            name: Installer-signed
            path: |
             ${{ github.workspace }}\\binary.exe
             if-no-files-found: error

      - run: echo "This job's status is ${{ job.status }}."

